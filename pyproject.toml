[project]
name = "study-copilot"
version = "0.1.0"
description = "个人 AI 学习助手 - 跨笔记、文章、收藏的问答系统"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "zhipuai>=2.1.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "pypdf>=4.0.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "chardet>=7.6.0",
    "langchain-openai>=1.6.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
